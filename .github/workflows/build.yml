name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers workflow on version tags (e.g., v1.0.0)

jobs:
  build:
    name: Build on Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: |
          cd build
          make -j$(nproc)

      - name: Prepare Artifacts
        run: |
          # Create a dedicated folder for release assets if needed, 
          # or bundle your binaries/archives here.
          mkdir -p release_assets
          # Example: Copying built binaries or files from build/
          # Adjust the path/filenames to match what your build generates.
          cp build/your_binary_name release_assets/

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
